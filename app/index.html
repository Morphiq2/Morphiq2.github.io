async function nextReceiptNo(){
  const base = db.sales.reduce((m, x) => Math.max(m, parseInt(x.id, 10) || 0), 0);
  try{
    const ref = fs.collection('meta').doc('counters');
    const n = await fs.runTransaction(async t => {
      const d = await t.get(ref); const cur = Math.max(d.exists ? (d.data().sale || 0) : 0, base);
      t.set(ref, {sale: cur + 1}, {merge:true}); return cur + 1;
    });
    return String(n).padStart(5,'0');
  }catch(e){   // offline: still unique, tidied number once back online isn't needed
    return String(base + 1).padStart(5,'0') + '-' + Math.random().toString(36).slice(2,5).toUpperCase();
  }
}
let checkingOut = false;
async function checkout(){
  if(!cart.length || !vehicleById(sellCar) || checkingOut) return;
  checkingOut = true;
  const btn = $('#sellBox .complete-sale'); if(btn){ btn.disabled = true; btn.firstChild && (btn.dataset.l = btn.innerHTML); }
  let id;
  try{ id = await nextReceiptNo(); } finally { checkingOut = false; }
  const t = cartTotals();
  const rec = parseFloat(sale.received), hasRec = sale.pay === 'Cash' && sale.received !== '' && !isNaN(rec);
  if(hasRec && rec < t.total) return toast('Amount received is less than the total');
  const label = vFull(vehicleById(sellCar));
  const items = cart.map(c => ({vehicleId:sellCar, vehicle:label, name:c.name, price:c.price, qty:c.qty}));
  const record = {
    id, date: new Date().toISOString(), items,
    subtotal:t.subtotal, vat:t.vat, vatRate:Number(db.settings.vat)||0, total:t.total,
    payment: sale.pay, customer: sale.customer.trim(), phone: sale.phone.trim(), by: currentUser.name,
    ...(hasRec ? {received:round2(rec), change:round2(rec - t.total)} : {})
  };
  db.sales.push(record); save();
  cart = []; sale = newSale(); sellCar = null;
  route();
  openModal(`<h3>Sale complete ✓</h3>${receiptHTML(record)}
    <div class="modal-actions"><button class="btn" id="doneBtn" onclick="closeModal()">Done</button></div>`);
  setTimeout(() => $('#doneBtn') && $('#doneBtn').focus(), 50);
}

/* ---------- Sales chart: last 7 days (single series bar chart) ---------- */
function drawSalesChart(){
  const days = [];
  for(let n = 6; n >= 0; n--){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - n);
    const list = db.sales.filter(s => sameDay(new Date(s.date), d));
    days.push({d, total:list.reduce((a,s)=>a+s.total,0), count:list.length});
  }
  const total = days.reduce((a,x)=>a+x.total,0);
  const W = 360, H = 170, padL = 8, padR = 8, padT = 14, padB = 26;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const max = Math.max(...days.map(x=>x.total));
  // nice top value for gridlines
  const step = max > 0 ? Math.pow(10, Math.floor(Math.log10(max))) : 1;
  const top = max > 0 ? Math.ceil(max / step) * step : 1;
  const slot = plotW / days.length, bw = Math.min(26, slot - 14);
  const y = v => padT + plotH - (v / top) * plotH;
  const grid = [0, .5, 1].map(f => `<line x1="${padL}" x2="${W-padR}" y1="${y(top*f)}" y2="${y(top*f)}" stroke="#efeff3" stroke-width="1" ${f===0?'':'stroke-dasharray="3 4"'}/>`).join('');
  const bars = days.map((x,i) => {
    const cx = padL + slot*i + slot/2, h = x.total > 0 ? Math.max(3, plotH - (y(x.total) - padT)) : 0;
    const isToday = i === days.length - 1;
    const label = x.d.toLocaleDateString(undefined,{weekday:'short'});
    // rounded top (4px), flat at the baseline
    const r = Math.min(4, h), x0 = cx - bw/2, y0 = padT + plotH - h;
    const path = h ? `M${x0},${padT+plotH} V${y0+r} Q${x0},${y0} ${x0+r},${y0} H${x0+bw-r} Q${x0+bw},${y0} ${x0+bw},${y0+r} V${padT+plotH} Z` : '';
    return `<rect class="bar-hit" x="${cx - slot/2}" y="${padT}" width="${slot}" height="${plotH}" fill="transparent"
        data-i="${i}" onmouseenter="chartTip(event,${i})" onmousemove="chartTip(event,${i})" onmouseleave="chartTip(null)"></rect>
      ${path ? `<path class="bar-mark" d="${path}" fill="${isToday ? 'var(--primary)' : '#e9a3aa'}" pointer-events="none"/>` : ''}
      <text x="${cx}" y="${H-6}" text-anchor="middle" font-size="11" fill="${isToday ? '#16181f' : '#8b8f9c'}" font-weight="${isToday?600:400}">${isToday ? 'Today' : label}</text>`;
  }).join('');
  chartDays = days;
  $('#chartBox').innerHTML = `
    <div class="card-head"><h3>Last 7 Days</h3><span class="sub">Daily sales</span></div>
    <div class="chart-total"><b>${money(total)}</b><span class="sub">${days.reduce((a,x)=>a+x.count,0)} receipt(s)</span></div>
    <div class="chart-wrap" id="chartWrap">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of daily sales for the last 7 days">${grid}${bars}</svg>
      <div class="chart-tip" id="chartTip"></div>
      <table class="sr-only"><caption>Daily sales, last 7 days</caption><tr><th>Day</th><th>Sales</th></tr>
        ${days.map(x=>`<tr><td>${x.d.toDateString()}</td><td>${money(x.total)}</td></tr>`).join('')}</table>
    </div>`;
}
let chartDays = [];
function chartTip(e, i){
  const tip = $('#chartTip'); if(!tip) return;
  document.querySelectorAll('#chartWrap .bar-mark.hover').forEach(m => m.classList.remove('hover'));
  if(!e){ tip.style.opacity = 0; return; }
  const x = chartDays[i], wrap = $('#chartWrap').getBoundingClientRect();
  const mark = e.target.nextElementSibling; if(mark && mark.classList.contains('bar-mark')) mark.classList.add('hover');
  tip.innerHTML = `<b>${money(x.total)}</b>${x.d.toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'short'})} · ${x.count} receipt(s)`;
  const r = e.target.getBoundingClientRect();
  tip.style.left = (r.left + r.width/2 - wrap.left) + 'px';
  tip.style.top = (e.clientY - wrap.top - 6) + 'px';
  tip.style.opacity = 1;
}

let recTab = 'sales';

function salesRows(){
  const st = STATE.sales, q = st.q.toLowerCase().trim(), r = rangeOf(st), rows = [];
  db.sales.forEach(s => {
    if(!inRange(s.date, r) || (st.pay && s.payment !== st.pay)) return;
    s.items.forEach((i, n) => {
      if(q && ![s.id, s.customer, s.phone, s.payment, s.by, i.name, i.vehicle].join(' ').toLowerCase().includes(q)) return;
      rows.push({key:s.id + '-' + n, s, i});
    });
  });
  return rows.reverse();
}
function purchaseRows(){
  const st = STATE.vbuy, q = st.q.toLowerCase().trim(), r = rangeOf(st);
  return db.vehicles.filter(v => inRange((v.date || v.created || '').slice(0,10) + 'T12:00:00', r) &&
    (!st.status || (st.status === 'finished' ? v.status === 'finished' : v.status !== 'finished')) &&
    (!q || [v.model, v.year, v.reg, v.by].join(' ').toLowerCase().includes(q)))
    .sort((a,b) => (b.date||'').localeCompare(a.date||''));
}

}

function periodFigures(r){
  const sales = db.sales.filter(s => inRange(s.date, r));
  const revenue = sales.reduce((a,s)=>a+saleNet(s),0);
  const vat = sales.reduce((a,s)=>a+(s.vat||0),0);
  const bought = db.vehicles.filter(v => inRange((v.date||'') + 'T12:00:00', r)).reduce((a,v)=>a+(v.price||0),0);
  const expenses = expInRange(r).reduce((a,e)=>a+e.amount,0);
  return {sales, revenue, vat, bought, expenses, net: revenue - bought - expenses};
}
function renderAnalytics(){
  const st = STATE.ana, r = rangeOf(st), periodLabel = periodName(st.range);
  const f = periodFigures(r), pr = prevRangeOf(st), p = pr ? periodFigures(pr) : null;
  const units = l => l.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.qty,0),0);
  const tile = (label, value, cur, prv, goodUp = true) => {
    let t = '';
    if(p && (cur || prv)){
      if(prv === 0) t = `<span class="ak-t ${(cur>0)===goodUp?'good':'bad'}">New</span>`;
      else { const pct = (cur - prv) / Math.abs(prv) * 100, good = pct === 0 || (pct > 0) === goodUp;
        t = `<span class="ak-t ${good?'good':'bad'}" title="vs ${esc(pr.label)}">${pct>=0?'▲':'▼'} ${Math.abs(pct).toFixed(Math.abs(pct)<10?1:0)}%</span>`; }
    }
    return `<div class="ak"><span class="ak-l">${label}</span><div class="ak-v"><b>${value}</b>${t}</div></div>`;
  };
  // where the money went: vehicles + each expense category
  const spend = [['Vehicles', f.bought]];
  const byCat = {}; expInRange(r).forEach(e => byCat[e.category] = (byCat[e.category]||0) + e.amount);
  Object.entries(byCat).sort((a,b)=>b[1]-a[1]).forEach(x => spend.push(x));
  const spendList = spend.filter(x => x[1] > 0);
  $('#app').innerHTML = `
    <div class="page-head">${ddButton(periodLabel, "dateMenu(event,'ana')", st.range !== 'all')}</div>
    <div class="ak-row">
      ${tile('Parts Income', money(f.revenue), f.revenue, p && p.revenue)}
      ${tile('Net Profit', `<span class="${f.net<0?'neg':''}">${money(f.net)}</span>`, f.net, p && p.net)}
      ${tile('Vehicles Bought', money(f.bought), f.bought, p && p.bought, false)}
      ${tile('Expenses', money(f.expenses), f.expenses, p && p.expenses, false)}
      ${tile('Parts Sold', String(units(f.sales)), units(f.sales), p && units(p.sales))}
    </div>

        ${spendList.length ? donutHTML(spendList) : emptyState('wallet','Nothing spent in this period')}</div>
    </div>

const SPEND_COLORS = ['#C01C2C','#2b7bb9','#1f9e89','#e3a008','#7c5cd6','#e8743b','#5a5f70','#9aa0ae'];
function donutHTML(list){
  const total = list.reduce((a,x)=>a+x[1],0), R = 70, r = 44, C = 90;
  let ang = -Math.PI/2;
  const pt = (rad, a) => [C + rad*Math.cos(a), C + rad*Math.sin(a)];
  const segs = list.map(([k,v],i) => {
    const frac = v/total, a0 = ang, a1 = ang + frac*Math.PI*2; ang = a1;
    const col = SPEND_COLORS[Math.min(i, SPEND_COLORS.length-1)];
    if(frac >= .9999) return `<circle cx="${C}" cy="${C}" r="${(R+r)/2}" fill="none" stroke="${col}" stroke-width="${R-r}"><title>${esc(k)}: ${money(v)}</title></circle>`;
    const big = a1 - a0 > Math.PI ? 1 : 0, [x0,y0] = pt(R,a0), [x1,y1] = pt(R,a1), [x2,y2] = pt(r,a1), [x3,y3] = pt(r,a0);
    return `<path class="d-seg" data-i="${i}" d="M${x0},${y0} A${R},${R} 0 ${big} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${big} 0 ${x3},${y3} Z" fill="${col}" stroke="var(--card)" stroke-width="2"><title>${esc(k)}: ${money(v)} (${(frac*100).toFixed(1)}%)</title></path>`;
  }).join('');
  return `<div class="donut">
    <svg viewBox="0 0 180 180" role="img" aria-label="Spending split">${segs}
      <text x="90" y="86" text-anchor="middle" font-size="10" fill="#8b8f9c">Total spent</text>
      <text x="90" y="103" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">${esc(money(total))}</text></svg>
    <ul class="d-legend">${list.map(([k,v],i) => `<li><i style="background:${SPEND_COLORS[Math.min(i, SPEND_COLORS.length-1)]}"></i><span>${esc(k)}</span><b>${money(v)}</b></li>`).join('')}</ul>
  </div>`;
}
let incomePts = [];
function drawIncomeChart(){
  const st = STATE.ana, now = new Date(), pts = [];
  if(st.chart === 'year'){
    const y = now.getFullYear();
    for(let m = 0; m < 12; m++){
      const d = new Date(y, m, 1), future = m > now.getMonth();
      const v = future ? null : db.sales.filter(s => { const x = new Date(s.date); return x.getFullYear()===y && x.getMonth()===m; }).reduce((a,s)=>a+saleNet(s),0);
      pts.push({label:d.toLocaleDateString(undefined,{month:'short'}), full:d.toLocaleDateString(undefined,{month:'long', year:'numeric'}), v});
    }
  } else {
    for(let n = 29; n >= 0; n--){
      const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-n);
      const v = db.sales.filter(s => sameDay(new Date(s.date), d)).reduce((a,s)=>a+saleNet(s),0);
      pts.push({label: n % 5 === 0 ? d.toLocaleDateString(undefined,{day:'numeric', month:'short'}) : '', full:d.toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short'}), v});
    }
  }
  const W = 640, H = 230, L = 44, Rr = 26, T = 14, B = 28, pw = W-L-Rr, ph = H-T-B;
  const vals = pts.filter(p => p.v !== null).map(p => p.v), max = Math.max(0, ...vals);
  const step0 = max > 0 ? Math.pow(10, Math.floor(Math.log10(max))) : 1000;
  const nice = [1,2,2.5,5,10].map(m => m*step0).find(s => s*4 >= max) || step0*10;
  const top = nice * 4;
  const x = i => L + (pts.length === 1 ? pw/2 : i * pw / (pts.length-1)), y = v => T + ph - v/top*ph;
  const short = v => v >= 1e6 ? (v/1e6).toFixed(v%1e6?1:0)+'M' : v >= 1e3 ? (v/1e3).toFixed(v%1e3?1:0)+'k' : String(v);
  const grid = [0,1,2,3,4].map(k => `<line x1="${L}" x2="${W-Rr}" y1="${y(nice*k)}" y2="${y(nice*k)}" stroke="${k?'var(--line)':'var(--line2)'}"/><text x="${L-10}" y="${y(nice*k)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${short(nice*k)}</text>`).join('');
  const xl = pts.map((p,i) => p.label ? `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(p.label)}</text>` : '').join('');
  const live = pts.map((p,i) => [p,i]).filter(([p]) => p.v !== null);
  const line = live.map(([p,i],n) => `${n?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const last = live[live.length-1];
  const area = live.length ? `${line} L${x(last[1]).toFixed(1)},${y(0)} L${x(live[0][1]).toFixed(1)},${y(0)} Z` : '';
  const total = vals.reduce((a,b)=>a+b,0);
  incomePts = pts.map((p,i) => ({...p, x:x(i), y:p.v===null?null:y(p.v)}));
  const slot = pw / Math.max(1, pts.length-1);
  $('#incomeChart').innerHTML = `
    <div class="ic-total"><b>${money(total)}</b><span>${st.chart==='year' ? 'from parts so far this year' : 'from parts in the last 30 days'}</span></div>
    <div class="ic-wrap" id="icWrap">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of parts income">
        <defs><linearGradient id="icFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C01C2C" stop-opacity=".16"/><stop offset="1" stop-color="#C01C2C" stop-opacity="0"/></linearGradient></defs>
        ${grid}${xl}
        ${area ? `<path d="${area}" fill="url(#icFill)"/>` : ''}
        ${line ? `<path d="${line}" fill="none" stroke="#C01C2C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
        ${last ? `<circle cx="${x(last[1])}" cy="${y(last[0].v)}" r="5" fill="var(--card)" stroke="#C01C2C" stroke-width="2"/>` : ''}
        <line id="icCross" x1="0" x2="0" y1="${T}" y2="${T+ph}" stroke="#c9ccd5" stroke-dasharray="3 3" opacity="0"/>
        <circle id="icDot" r="5" fill="#C01C2C" stroke="#fff" stroke-width="2" opacity="0"/>
        ${pts.map((p,i) => `<rect x="${x(i)-slot/2}" y="${T}" width="${slot}" height="${ph}" fill="transparent" onmouseenter="icTip(${i})" onmousemove="icTip(${i})" onmouseleave="icTip(-1)"/>`).join('')}
      </svg>
      <div class="chart-tip" id="icTip"></div>
      <table class="sr-only"><caption>Parts income</caption>${pts.map(p=>`<tr><td>${esc(p.full)}</td><td>${p.v===null?'—':money(p.v)}</td></tr>`).join('')}</table>
    </div>`;
}
function icTip(i){
  const tip = $('#icTip'), cross = $('#icCross'), dot = $('#icDot'); if(!tip) return;
  const p = incomePts[i];
  if(!p){ tip.style.opacity = 0; cross.setAttribute('opacity',0); dot.setAttribute('opacity',0); return; }
  const svg = $('#icWrap svg'), sc = svg.getBoundingClientRect().width / 640;
  cross.setAttribute('x1', p.x); cross.setAttribute('x2', p.x); cross.setAttribute('opacity', 1);
  if(p.y !== null){ dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.y); dot.setAttribute('opacity', 1); } else dot.setAttribute('opacity', 0);
  tip.innerHTML = `<b>${p.v===null ? '—' : money(p.v)}</b><br><span style="opacity:.7">${esc(p.full)}</span>`;
  tip.style.left = (p.x * sc) + 'px'; tip.style.top = ((p.y === null ? 120 : p.y) * sc) + 'px'; tip.style.opacity = 1;
}

// Resize an uploaded image so it fits comfortably in browser storage
function shrinkImage(file, max){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/png'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

let currentUser = null;

const DEFAULT_ADMIN_EMAIL = 'admin@gmail.com', DEFAULT_ADMIN_PW = '12345678';
let bootstrapping = null;   // first-run admin setup in progress
const authMsg = code => ({
  'auth/invalid-credential':'Incorrect email or password.', 'auth/wrong-password':'Incorrect email or password.',
  'auth/user-not-found':'Incorrect email or password.', 'auth/invalid-email':'Enter a valid email address.',
  'auth/too-many-requests':'Too many attempts. Wait a minute and try again.', 'auth/network-request-failed':'No internet connection.',
  'auth/email-already-in-use':'A user with this email already exists.', 'auth/weak-password':'Password must be at least 6 characters.',
  'auth/operation-not-allowed':'Email/password sign-in is not turned on in Firebase.',
  'auth/requires-recent-login':'For security, sign out and back in, then try again.'
}[code] || 'Something went wrong. Please try again.');

function refreshCurrentUser(){

$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  const email = $('#lgEmail').value.trim().toLowerCase(), pw = $('#lgPass').value, btn = $('#loginForm button.btn');
  $('#lgError').textContent = ''; btn.disabled = true;
  try{
    try{ await fbAuth.signInWithEmailAndPassword(email, pw); }
    catch(err){
      // First run: the default administrator doesn't exist yet, so create it
      if(email === DEFAULT_ADMIN_EMAIL && pw === DEFAULT_ADMIN_PW && ['auth/user-not-found','auth/invalid-credential','auth/invalid-login-credentials'].includes(err.code)){
        bootstrapping = (async () => {
          const cred = await fbAuth.createUserWithEmailAndPassword(email, pw);
          await fs.collection('users').doc(cred.user.uid).set({name:'Administrator', email, role:'admin', builtin:true, created:new Date().toISOString(), _t:Date.now()*1000});
        })();
        try{ await bootstrapping; } finally { bootstrapping = null; }
      } else throw err;
    }
  }catch(err){
    console.error(err);
    $('#lgError').textContent = err.code === 'auth/email-already-in-use' ? 'Incorrect email or password.' : authMsg(err.code);
    $('#lgPass').select();
  }finally{ btn.disabled = false; }
};
fbAuth.onAuthStateChanged(async user => {
  if(!user){ stopListeners(); currentUser = null; showLogin(); return; }
  $('#bootLoader').style.display = '';
  $('#login').style.display = 'none';
  if(bootstrapping) await bootstrapping.catch(() => {});
  let doc;
  try{ doc = await fs.collection('users').doc(user.uid).get(); }
  catch(err){ console.error(err); }
  if(!doc || !doc.exists){
    await fbAuth.signOut();
    $('#lgError').textContent = doc ? 'This account has no access. Ask an administrator.' : 'Could not reach the database. Check your connection.';
    return;
  }
  currentUser = {id:user.uid, ...doc.data()};
  if(currentUser.theme) applyTheme(currentUser.theme === 'dark');
  startListeners();
  await firstLoad;
  if(location.hash === '#settings' && !isAdmin()) location.replace('#vehicles');
  showApp();
  toast('Welcome, ' + currentUser.name.split(' ')[0]);
});

  columns: [
    {key:'name', label:'Name', html:u=>who(u.name, {html:`<b class="ink">${esc(u.name)}</b>${u.id===currentUser.id ? '<span class="you-tag">You</span>' : ''}`}), sort:u=>u.name},
    {key:'email', label:'Email', html:u=>esc(u.email), sort:u=>u.email},
    {key:'role', label:'Role', html:u=>u.role==='admin' ? '<span class="tpill red">Administrator</span>' : '<span class="tpill sky">Staff</span>', sort:u=>u.role},
    {key:'created', label:'Added', html:u=>u.created ? niceDay(u.created.slice(0,10)) : '—', sort:u=>u.created||''}
  ],
  actions: u => rowIcons([['edit', `userForm('${u.id}')`, 'Edit user'], ['key', `passwordForm('${u.id}')`, 'Reset password'], ...(u.id !== currentUser.id ? [['trash', `deleteUser('${u.id}')`, 'Delete user', true]] : [])]).replace('class="row-icons"','class="row-icons always"')
});
function userRowMenu(e, id){
  const u = db.users.find(x => x.id === id);
  openMenu(e, [
    {label:'Edit user', fn:()=>userForm(id)},
    {label:'Reset password', fn:()=>passwordForm(id)},
    ...(u.id !== currentUser.id ? [{label:'Delete user', danger:true, fn:()=>deleteUser(id)}] : [])
  ]);
}
const adminCount = () => db.users.filter(u => u.role === 'admin').length;
function userForm(id){
  const u = id ? db.users.find(x => x.id === id) : {name:'', email:'', role:'staff'};
  const self = id === currentUser.id;
  openModal(`<h3>${id ? 'Edit user' : 'Add user'}</h3>
    <form id="f">
      <div class="field"><label>Full name</label><input name="name" required value="${esc(u.name)}" placeholder="e.g. Mary Banda"></div>
      <div class="field"><label>Email</label><input name="email" type="email" required value="${esc(u.email)}" placeholder="name@example.com" ${id?'readonly':''}>${id?'<div class="hint">The sign-in email can’t be changed here.</div>':''}</div>
      <div class="field"><label>Role</label><select name="role" ${self?'disabled':''}>
        <option value="staff" ${u.role==='staff'?'selected':''}>Staff — sales, inventory, records, expenses, analytics</option>
        <option value="admin" ${u.role==='admin'?'selected':''}>Administrator — everything, including Settings and users</option></select>
        ${self ? '<div class="hint">You can’t change your own role.</div>' : ''}</div>
      ${id ? '' : `<div class="field"><label>Password</label><input name="pw" type="password" required minlength="6" placeholder="At least 6 characters"></div>`}
      <div class="login-error" id="ufErr"></div>
      <div class="modal-actions"><button type="button" class="btn outline" onclick="closeModal()">Cancel</button><button class="btn">${id ? 'Save Changes' : 'Create User'}</button></div>
    </form>`);
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, email = f.email.value.trim().toLowerCase(), name = f.name.value.trim();
    const role = self ? u.role : f.role.value;
    if(db.users.some(x => x.email.toLowerCase() === email && x.id !== id)){ $('#ufErr').textContent = 'A user with this email already exists.'; return; }
    if(id && u.role === 'admin' && role !== 'admin' && adminCount() <= 1){ $('#ufErr').textContent = 'There must be at least one administrator.'; return; }
    if(id){ Object.assign(u, {name, role}); }
    else {
      const pw = f.pw.value;
      if(pw.length < 6){ $('#ufErr').textContent = 'Password must be at least 6 characters.'; return; }
      const btn = f.querySelector('button.btn:not(.outline)'); btn.disabled = true;
      try{
        const sec = firebase.apps.find(a => a.name === 'secondary') || firebase.initializeApp(firebaseConfig, 'secondary');
        const cred = await sec.auth().createUserWithEmailAndPassword(email, pw);
        await sec.auth().signOut();
        db.users.push({id:cred.user.uid, name, email, role, created:new Date().toISOString()});
      }catch(err){ btn.disabled = false; $('#ufErr').textContent = authMsg(err.code); return; }
    }
    save(); closeModal(); toast(id ? 'User updated' : 'User created'); route();
  };
}
function passwordForm(id){
  const u = db.users.find(x => x.id === id);
  if(id !== currentUser.id){
    confirmBox(`Send a password reset email to ${u.name} (${u.email})? They'll choose a new password from the link in the email.`, async () => {
      try{ await fbAuth.sendPasswordResetEmail(u.email); toast('Reset email sent to ' + u.email); }
      catch(err){ toast(authMsg(err.code)); }
    }, 'Send email');
    return;
  }
  openModal(`<h3>Change your password</h3>
    <form id="f">
      <div class="field"><label>Current password</label><input name="cur" type="password" required></div>
      <div class="field"><label>New password</label><input name="pw" type="password" required minlength="6" placeholder="At least 6 characters"></div>
      <div class="field"><label>Confirm new password</label><input name="pw2" type="password" required minlength="6"></div>
      <div class="login-error" id="ufErr"></div>
      <div class="modal-actions"><button type="button" class="btn outline" onclick="closeModal()">Cancel</button><button class="btn">Save Password</button></div>
    </form>`);
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    if(f.pw.value.length < 6){ $('#ufErr').textContent = 'Password must be at least 6 characters.'; return; }
    if(f.pw.value !== f.pw2.value){ $('#ufErr').textContent = 'The passwords don’t match.'; return; }
    try{
      const user = fbAuth.currentUser;
      await user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email, f.cur.value));
      await user.updatePassword(f.pw.value);
      closeModal(); toast('Password updated');
    }catch(err){ $('#ufErr').textContent = authMsg(err.code); }
  };
}
function deleteUser(id){
  const u = db.users.find(x => x.id === id);
  if(u.role === 'admin' && adminCount() <= 1) return toast('There must be at least one administrator');
  confirmBox(`Remove ${u.name}? They will no longer be able to open the system.`, () => {
    db.users = db.users.filter(x => x.id !== id);
    save(); toast('User deleted'); route();
  });
}

/* ---------- Start: Firebase Auth decides whether to show the login or the app ---------- */
</script>
</body>
</html>
