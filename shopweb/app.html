<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shopkeeper</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
</head>
<body>
  <div class="app-shell">
    <!-- ── Desktop sidebar ───────────────────────────────────────────── -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-mark"><img src="assets/logo.jpg" alt="Shopkeeper" /></div>
        <div class="logo-text"><h1>Shopkeeper</h1><p>POS Management</p></div>
      </div>
      <div class="sidebar-menu" id="sidebarMenu"></div>
      <div class="sidebar-settings" id="sidebarSettings"></div>
    </nav>

    <div class="main-col">
      <!-- mobile app bar -->
      <div class="mobile-appbar">
        <h2 id="mobileTitle">Shopkeeper</h2>
        <button class="btn-icon topbar-btn" id="mobileProfileBtn" style="border:none">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
        </button>
      </div>
      <div class="topbar" id="topbar" style="display:none">
        <h2 id="topbarTitle"></h2>
        <div class="topbar-actions" id="topbarActions"></div>
      </div>
      <div id="syncBanner"></div>
      <div class="page-scroll" id="pageRoot"></div>
    </div>

    <!-- ── Mobile bottom nav ─────────────────────────────────────────── -->
    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
